name: Build and Deploy NodeJS App on AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "254771353010"

  ECR_REPOSITORY: ci-cd-demo

  ECS_CLUSTER: frdn-cluster
  ECS_SERVICE: frdn-service
  ECS_TASK_FAMILY: frdn-task
  ECS_CONTAINER: frdn-container

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout source code
      # ==================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Debug GitHub OIDC token
      # ==================================================
      # This is temporarily kept so we can verify that
      # GitHub is sending the expected OIDC claims.
      # ==================================================
      - name: Debug GitHub OIDC token
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref
          }'


      # ==================================================
      # 3. Configure AWS credentials using OIDC
      # ==================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254771353010:role/GitHubActionsECSDeployFrdnRole
          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 4. Verify AWS identity
      # ==================================================
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ==================================================
      # 5. Login to Amazon ECR
      # ==================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 6. Build and push Docker image
      # ==================================================
      - name: Build and push Docker image
        id: build
        run: |

          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"

          LATEST_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

          echo "========================================="
          echo "Building Docker image"
          echo "========================================="

          echo "Image:"
          echo "$IMAGE_URI"

          docker build -t "$IMAGE_URI" .

          echo "========================================="
          echo "Creating latest tag"
          echo "========================================="

          docker tag "$IMAGE_URI" "$LATEST_URI"

          echo "========================================="
          echo "Pushing commit image"
          echo "========================================="

          docker push "$IMAGE_URI"

          echo "========================================="
          echo "Pushing latest image"
          echo "========================================="

          docker push "$LATEST_URI"

          echo "========================================="
          echo "Docker images pushed successfully"
          echo "========================================="

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 7. Get current ECS task definition
      # ==================================================
      - name: Get current ECS task definition
        run: |

          echo "Getting ECS task definition:"
          echo "$ECS_TASK_FAMILY"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Current task definition:"
          cat task-definition.json


      # ==================================================
      # 8. Create new ECS task definition JSON
      # ==================================================
      - name: Create new ECS task definition revision
        id: task
        env:
          IMAGE_URI: ${{ steps.build.outputs.image }}

        run: |

          echo "========================================="
          echo "New Docker image"
          echo "========================================="

          echo "$IMAGE_URI"

          jq --arg IMAGE "$IMAGE_URI" \
             --arg CONTAINER "$ECS_CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            ' task-definition.json > new-task-definition.json

          echo "========================================="
          echo "New task definition"
          echo "========================================="

          cat new-task-definition.json


      # ==================================================
      # 9. Register new ECS task definition
      # ==================================================
      - name: Register new ECS task definition
        id: register
        run: |

          echo "Registering new ECS task definition..."

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "========================================="
          echo "New task definition registered"
          echo "========================================="

          echo "$TASK_ARN"

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 10. Update ECS service
      # ==================================================
      - name: Deploy new task definition to ECS
        env:
          TASK_ARN: ${{ steps.register.outputs.task_arn }}

        run: |

          echo "========================================="
          echo "Updating ECS service"
          echo "========================================="

          echo "Cluster:"
          echo "$ECS_CLUSTER"

          echo "Service:"
          echo "$ECS_SERVICE"

          echo "Task Definition:"
          echo "$TASK_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_ARN"

          echo "ECS service update requested successfully."


      # ==================================================
      # 11. Wait for ECS deployment
      # ==================================================
      - name: Wait for ECS service stability
        run: |

          echo "========================================="
          echo "Waiting for ECS service to become stable"
          echo "========================================="

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "========================================="
          echo "ECS service is stable"
          echo "========================================="


      # ==================================================
      # 12. Deployment completed
      # ==================================================
      - name: Deployment completed
        run: |

          echo "========================================="
          echo " ECS DEPLOYMENT COMPLETED SUCCESSFULLY "
          echo "========================================="

          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo "Commit:"
          echo "$GITHUB_SHA"

          echo "ECR Repository:"
          echo "$ECR_REPOSITORY"

          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          echo "ECS Service:"
          echo "$ECS_SERVICE"

          echo "Deployment finished successfully!"
