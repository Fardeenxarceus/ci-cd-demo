name: Build and Deploy NodeJS App on AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "254771353010"

  ECR_REPOSITORY: ci-cd-demo

  ECS_CLUSTER: frdn-cluster
  ECS_SERVICE: frdn-service
  ECS_TASK_FAMILY: frdn-task
  ECS_CONTAINER: frdn-container

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub repository
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::254771353010:role/GitHubActionsECSDeployFrdnRole
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Verify AWS authentication
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------
      # 4. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 5. Build Docker image and push to ECR
      # --------------------------------------------------
      - name: Build and push Docker image
        id: build
        run: |

          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"

          LATEST_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

          echo "Building Docker image:"
          echo "$IMAGE_URI"

          docker build -t "$IMAGE_URI" .

          echo "Creating latest tag..."

          docker tag "$IMAGE_URI" "$LATEST_URI"

          echo "Pushing commit image..."

          docker push "$IMAGE_URI"

          echo "Pushing latest image..."

          docker push "$LATEST_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 6. Get current ECS task definition
      # --------------------------------------------------
      - name: Get current ECS task definition
        run: |

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Current ECS task definition:"
          cat task-definition.json


      # --------------------------------------------------
      # 7. Create new ECS task definition
      #    with the new Docker image
      # --------------------------------------------------
      - name: Create new ECS task definition revision
        id: task
        env:
          IMAGE_URI: ${{ steps.build.outputs.image }}

        run: |

          echo "New Docker image:"
          echo "$IMAGE_URI"

          jq --arg IMAGE "$IMAGE_URI" \
             --arg CONTAINER "$ECS_CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            ' task-definition.json > new-task-definition.json

          echo "New ECS task definition:"
          cat new-task-definition.json


      # --------------------------------------------------
      # 8. Register new ECS task definition revision
      # --------------------------------------------------
      - name: Register new ECS task definition
        id: register
        run: |

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition:"
          echo "$TASK_ARN"

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 9. Update ECS service
      # --------------------------------------------------
      - name: Deploy new task definition to ECS
        env:
          TASK_ARN: ${{ steps.register.outputs.task_arn }}

        run: |

          echo "Updating ECS service..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_ARN"

          echo "ECS service update requested successfully."


      # --------------------------------------------------
      # 10. Wait until ECS deployment is stable
      # --------------------------------------------------
      - name: Wait for ECS service stability
        run: |

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS service is stable."


      # --------------------------------------------------
      # 11. Deployment completed
      # --------------------------------------------------
      - name: Deployment completed
        run: |

          echo "========================================="
          echo "   ECS DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"

